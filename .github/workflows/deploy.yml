name: Build and Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The cPanel server is missing the libraries Chrome needs to start
      # (libXtst.so.6 and friends), which is why react-snap's postbuild
      # step always failed there and published an empty shell. GitHub's
      # runner can install them, so the build happens here instead.
      - name: Install Chrome dependencies for react-snap
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxtst6 libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64 \
            libatk1.0-0 libcups2 libxss1 || true

      - name: Build site
        run: npm run build

      # Stop before uploading if prerendering silently failed. A real
      # homepage is ~150 KB; the broken empty shell is ~3 KB. This is the
      # guard that stops a blank site ever reaching production again.
      - name: Verify prerender worked
        run: |
          echo "--- dist contents ---"
          ls -la dist/
          SIZE=$(wc -c < dist/index.html)
          echo "dist/index.html is $SIZE bytes"
          if [ "$SIZE" -lt 20000 ]; then
            echo "FAIL: index.html is only $SIZE bytes - react-snap did not prerender."
            exit 1
          fi
          for ROUTE in tms-therapy psychiatric medical-weight-loss insurance; do
            if [ ! -f "dist/$ROUTE/index.html" ]; then
              echo "FAIL: dist/$ROUTE/index.html missing - route folders not generated."
              exit 1
            fi
          done
          echo "PASS: prerendering produced full pages for all routes."

      # dangerous-clean-slate is off on purpose: it would wipe the whole
      # of public_html including the WordPress blog. exclude list below
      # protects everything on the server that is not part of this build.
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: public_html/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            blog/**
            webhook/**
            deploy.php
            .well-known/**
            cgi-bin/**

      - name: Confirm deployment
        run: |
          sleep 10
          echo "--- checking live site ---"
          HOME_SIZE=$(curl -sL https://trivalleyclinic.com/ | wc -c)
          TMS_SIZE=$(curl -sL https://trivalleyclinic.com/tms-therapy/ | wc -c)
          echo "Homepage:  $HOME_SIZE bytes"
          echo "TMS page:  $TMS_SIZE bytes"
          if [ "$HOME_SIZE" -lt 20000 ]; then
            echo "WARNING: live homepage is only $HOME_SIZE bytes - check server caching."
          else
            echo "SUCCESS: live site is serving full prerendered content."
          fi