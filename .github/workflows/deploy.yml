name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SITE: https://trivalleyclinic.com

jobs:
  build-deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Chrome system libraries (for react-snap)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxss1 libgbm1 \
            libpango-1.0-0 libcairo2 libasound2 libgtk-3-0 libx11-xcb1

      - name: Install dependencies
        run: npm ci

      - name: Build + prerender
        run: npm run build

      - name: Remove anything that would overwrite WordPress
        run: |
          # If react-snap crawled a React /blog route, it would write dist/blog/index.html,
          # which would shadow WordPress in public_html/blog/. Never ship it.
          rm -rf dist/blog

      - name: Verify prerender (fail if any page is an empty shell)
        run: |
          fail=0

          # Expected route count comes from package.json reactSnap.include,
          # so adding a route never needs this workflow edited.
          expected=$(node -e "
            const p=require('./package.json');
            const inc=(p.reactSnap&&p.reactSnap.include)||[];
            if(!inc.length){console.error('reactSnap.include missing in package.json');process.exit(1);}
            console.log(inc.filter(r=>!r.startsWith('/blog')).length);
          ")
          echo "Routes listed in package.json reactSnap.include: $expected"

          count=0
          while IFS= read -r f; do
            count=$((count+1))
            if grep -q '<div id="root"></div>' "$f"; then
              echo "::error::Empty shell (not prerendered): $f"
              fail=1
            fi
          done < <(find dist -name index.html)

          size=$(stat -c%s dist/index.html)
          echo "Prerendered HTML files: $count"
          echo "dist/index.html: $size bytes"

          if [ "$size" -lt 20000 ]; then
            echo "::error::Homepage too small ($size bytes) - prerender likely failed"
            fail=1
          fi
          if [ "$count" -lt "$expected" ]; then
            echo "::error::Expected $expected prerendered routes, got $count"
            fail=1
          fi
          exit $fail

      - name: Add build marker + manifest
        run: |
          test -f dist/.htaccess || { echo "::error::dist/.htaccess missing (public/.htaccess not in repo?)"; exit 1; }
          echo "${GITHUB_SHA}" > dist/build.txt
          # Optional: lets cPanel's own "Deploy HEAD Commit" button work too (copy-only, no delete)
          cp deploy/cpanel.deploy.yml dist/.cpanel.yml
          # List of every file + sha256. The server hook copies ONLY these, and verifies each hash.
          node deploy/make-manifest.cjs dist

      - name: Push build to deploy branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMOTE="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads "$REMOTE" deploy > /dev/null; then
            git clone --depth 1 --branch deploy "$REMOTE" deploy-branch
          else
            mkdir deploy-branch
            git -C deploy-branch init -b deploy
            git -C deploy-branch remote add origin "$REMOTE"
          fi

          rsync -a --delete --exclude '.git' dist/ deploy-branch/
          cd deploy-branch
          git add -A
          git commit -m "Build ${GITHUB_SHA::7}" || echo "Nothing new to commit (identical build) - continuing"
          git push origin deploy

      - name: Deploy on server (hook pulls deploy branch, copies + hash-verifies every file)
        env:
          HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          HOOK_TOKEN: ${{ secrets.DEPLOY_HOOK_TOKEN }}
        run: |
          if [ -z "$HOOK_URL" ] || [ -z "$HOOK_TOKEN" ]; then
            echo "::error::DEPLOY_HOOK_URL / DEPLOY_HOOK_TOKEN secrets not set."
            exit 1
          fi
          code=$(curl -sS --max-time 290 -o resp.json -w '%{http_code}' \
            -X POST -H "X-Deploy-Token: ${HOOK_TOKEN}" "${HOOK_URL}?action=deploy")
          cat resp.json; echo
          if [ "$code" != "200" ]; then
            echo "::error::Hook returned HTTP ${code}"
            exit 1
          fi
          # The server itself must confirm: no errors AND public_html/build.txt == this commit
          jq -e --arg sha "$GITHUB_SHA" '.ok == true and .build == $sha and .live_build_txt == $sha' resp.json > /dev/null \
            || { echo "::error::Server did not confirm build ${GITHUB_SHA::7}"; exit 1; }
          echo "Server confirmed build ${GITHUB_SHA::7} is on disk."

      - name: Clear NGINX cache
        env:
          HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          HOOK_TOKEN: ${{ secrets.DEPLOY_HOOK_TOKEN }}
        run: |
          curl -fsS --max-time 60 -X POST -H "X-Deploy-Token: ${HOOK_TOKEN}" "${HOOK_URL}?action=clear_cache" \
            || echo "::warning::Cache clear failed - clear NGINX cache manually in cPanel."
          echo

      - name: Wait until the public site serves the new build
        run: |
          for i in $(seq 1 12); do
            live=$(curl -fsSL -H "Cache-Control: no-cache" "${SITE}/build.txt?nc=$(date +%s)" 2>/dev/null | tr -d '[:space:]' || true)
            if [ "$live" = "${GITHUB_SHA}" ]; then
              echo "Public site serves build ${GITHUB_SHA::7}"
              exit 0
            fi
            echo "Waiting... public='${live:0:7}' expected='${GITHUB_SHA::7}' ($i/12)"
            sleep 10
          done
          echo "::error::Files are on disk (server confirmed) but the public site still serves an old response. This is an NGINX/CDN cache issue - clear cache in cPanel."
          exit 1

      - name: Verify live pages (curl -L follows trailing-slash redirects)
        run: |
          fail=0
          for p in / /insurance /tms-therapy; do
            size=$(curl -sL -o /dev/null -w '%{size_download}' "${SITE}${p}")
            code=$(curl -sL -o /dev/null -w '%{http_code}' "${SITE}${p}")
            echo "${p} -> HTTP ${code}, ${size} bytes"
            if [ "$code" != "200" ] || [ "$size" -lt 20000 ]; then
              echo "::error::${p} failed check"; fail=1
            fi
          done
          blog=$(curl -sL -o /dev/null -w '%{http_code}' "${SITE}/blog/")
          echo "/blog/ -> HTTP ${blog}"
          [ "$blog" = "200" ] || { echo "::error::WordPress blog not returning 200"; fail=1; }
          exit $fail

      - name: Verify EVERY file on the public site against the manifest (sha256)
        run: |
          # Wait ~2.5 min so a competing writer (cron, scanner, old script) has time to show itself,
          # then compare all files as the public actually receives them.
          sleep 150
          node deploy/verify-live.cjs dist/manifest.json "${SITE}"

      - name: Diagnose (runs only if something above failed)
        if: failure()
        env:
          HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          HOOK_TOKEN: ${{ secrets.DEPLOY_HOOK_TOKEN }}
        run: |
          [ -n "$HOOK_URL" ] && [ -n "$HOOK_TOKEN" ] || { echo "no hook secrets, skipping"; exit 0; }
          echo "----- server diagnostics -----"
          curl -sS --max-time 60 -X POST -H "X-Deploy-Token: ${HOOK_TOKEN}" "${HOOK_URL}?action=diag" || true
          echo